<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5c0e33">
  <meta name="robots" content="noindex, nofollow">
  <title>Order dashboard | Forever Florals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,0..144,500;1,0..144,600&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--blush:#fff3f6;--magenta:#c81d67;--deep:#5c0e33;--ink:#2c0f1e;--purple:#6f35b5;box-sizing:border-box}
    *,*::before,*::after{box-sizing:inherit}
    body{min-height:100vh;margin:0;background:linear-gradient(145deg,#fff3f6,#fce7f0);color:var(--ink);font:400 16px/1.6 'Sora',sans-serif}
    button,input{font:inherit}
    .wrap{width:min(1120px,calc(100% - 36px));margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 0}
    header a{color:var(--deep);font-weight:700}
    h1,h2,h3{font-family:'Fraunces',serif;line-height:1.15;color:var(--deep)}
    h1{margin:0;font-size:clamp(2rem,5vw,3rem)}
    h2{margin:0 0 16px}
    main{padding:24px 0 72px}
    .intro{margin:0 0 26px;color:#674b5a}
    .panel{padding:24px;background:#fff;border:1px solid rgba(92,14,51,.12);border-radius:18px;box-shadow:0 12px 36px rgba(92,14,51,.08)}
    .login{max-width:460px;margin:40px auto}
    .login form{display:grid;gap:14px}
    label{display:grid;gap:6px;font-size:.88rem;font-weight:700}
    input{width:100%;min-height:46px;padding:10px 12px;border:1px solid #c8b7c0;border-radius:8px;background:#fff}
    input:focus-visible,button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
    button{min-height:42px;padding:9px 15px;border:0;border-radius:8px;background:var(--purple);color:#fff;font-weight:700;cursor:pointer}
    button.secondary{border:1px solid #c8b7c0;background:#fff;color:var(--deep)}
    button.danger{background:#8b1738}
    button:disabled{opacity:.6;cursor:wait}
    .status{min-height:1.5em;margin:12px 0 0;color:var(--deep);font-size:.88rem}
    .error{color:#9a123a}
    [hidden]{display:none!important}
    .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:24px 0}
    .metric span{display:block;color:#705967;font-size:.85rem}
    .metric strong{display:block;margin-top:4px;color:var(--deep);font-size:clamp(1.6rem,3vw,2.2rem)}
    .orders-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 16px}
    .orders-header h2{margin:0}
    .order-list{display:grid;gap:16px}
    .order{display:grid;gap:15px}
    .order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    .order-top h3{margin:0 0 4px;font-size:1.3rem}
    .order-meta,.order-details{margin:0;color:#604d59;font-size:.86rem;overflow-wrap:anywhere}
    .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#f0e9f4;color:#5b3377;font-size:.75rem;font-weight:800;text-transform:uppercase;white-space:nowrap}
    .badge.confirmed{background:#fff0cf;color:#7b4c00}
    .badge.paid{background:#dff5e7;color:#175a31}
    .badge.cancelled{background:#fbe0e6;color:#8b1738}
    .order-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .order-details strong{color:var(--ink)}
    .order-controls{display:flex;align-items:end;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid #eee2e8}
    .order-controls label{min-width:190px;flex:1}
    .order-controls input{min-height:42px}
    .empty{padding:28px;text-align:center;color:#705967}
    @media(max-width:600px){.wrap{width:min(100% - 24px,1120px)}.panel{padding:18px}.metrics,.order-columns{grid-template-columns:1fr}.order-top{flex-direction:column}.orders-header{align-items:flex-start}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/" aria-label="Forever Florals home">Forever Florals</a>
      <button class="secondary" type="button" data-sign-out hidden>Sign out</button>
    </header>
    <main>
      <h1>Order dashboard</h1>
      <p class="intro">Review customer inquiries, confirm totals and send invoices, then mark orders paid to update lifetime sales.</p>

      <section class="panel login" data-login-panel aria-labelledby="login-heading">
        <h2 id="login-heading">Admin sign in</h2>
        <form data-login-form>
          <label>Email address<input type="email" name="email" autocomplete="username" required></label>
          <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
          <button type="submit">Sign in</button>
        </form>
        <p class="status" data-login-status role="status"></p>
      </section>

      <section data-dashboard hidden>
        <div class="metrics">
          <article class="panel metric"><span>Lifetime paid orders</span><strong data-lifetime-count>0</strong></article>
          <article class="panel metric"><span>Lifetime revenue (JMD)</span><strong data-lifetime-revenue>$0</strong></article>
        </div>
        <div class="orders-header">
          <h2>All inquiries and orders</h2>
          <button class="secondary" type="button" data-refresh>Refresh</button>
        </div>
        <p class="status" data-dashboard-status role="status"></p>
        <div class="order-list" data-order-list></div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
